/* ---- app styles (plain CSS so they work with or without the Tailwind build) ---- */
:root { color-scheme: dark; -webkit-tap-highlight-color: transparent; }
html, body { background: #07102a; color: #f1f5ff; }
body { margin: 0; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, [role='button']:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #5b8cff; outline-offset: 2px;
}
.pt-safe { padding-top: env(safe-area-inset-top, 0px); }
.pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.sheet-in { animation: sheet-in 0.22s ease-out; }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast-in { animation: toast-in 0.18s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.pulse-ring { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); animation: pulse-ring 1.4s infinite; }
@keyframes pulse-ring { 70% { box-shadow: 0 0 0 22px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
@media (prefers-reduced-motion: reduce) {
  .sheet-in, .toast-in, .pulse-ring, .animate-spin { animation: none !important; }
}

tam","Por lo menos","At least","phrase","Por lo menos llegamos a tiempo.","At least we got there on time."],["B1","latam","Mientras tanto","Meanwhile","phrase","Mientras tanto, ve preparando la comida.","Meanwhile, start getting the food ready."],["B1","latam","Me da igual","I don't mind / it's all the same to me","phrase","Me da igual d\xF3nde comamos.","I don't mind where we eat."],["B1","latam","Ponerse de acuerdo","To come to an agreement","phrase","No nos pudimos poner de acuerdo.","We couldn't agree."],["B1","latam","Quejarse","To complain","verb","Siempre se queja del jefe.","He always complains about the boss."],["B1","latam","Pedir prestado","To borrow","phrase","\xBFTe puedo pedir prestado el carro?","Can I borrow your car?"],["B1","latam","Estar harto de","To be fed up with","phrase","Estoy harto de este calor.","I'm fed up with this heat."],["B1","latam","Tomar en serio","To take seriously","phrase","No me tomas en serio.","You don't take me seriously."],["B1","latam","Me toc\xF3","It was my turn / I got stuck with","phrase","Me toc\xF3 trabajar el domingo.","I got stuck working Sunday."],["B1","latam","Hacerse cargo de","To take charge of / take care of","phrase","Yo me hago cargo de la comida.","I'll take care of the food."],["B1","latam","Seguir","To keep (doing something)","verb","Sigo aprendiendo todos los d\xEDas.","I keep learning every day.","Grammar: seguir + -ando/-iendo."],["B1","latam","Dejar de","To stop (doing something)","phrase","Dej\xE9 de tomar refresco.","I stopped drinking soda."],["B1","latam","Tardar","To take (time)","verb","\xBFCu\xE1nto tardas en llegar?","How long does it take you to get there?"],["B1","latam","Echarle ganas","To give it your all","phrase","\xC9chale ganas, que t\xFA puedes.","Give it your all, you can do it.","Very common in Mexico; understood widely."],["B1","pr","\xBFQu\xE9 t\xFA crees?","What do you think?","phrase","\xBFQu\xE9 t\xFA crees de la idea?","What do you think about the idea?",'PR keeps "t\xFA" before the verb in questions. Elsewhere: \xBFQu\xE9 crees t\xFA?'],["B1","pr","Estar esmayao","To be starving","slang","Estoy esmayao, vamos a comer.","I'm starving, let's go eat.",'From "desmayado".'],["B1","pr","Dar pon","To give (someone) a ride","slang","\xBFMe das pon hasta el trabajo?","Can you give me a ride to work?",`Mexico says "dar un avent\xF3n"; in Texas you'll hear "dar raite".`],["B1","pr","Estar pelao","To be broke","slang","No puedo salir, estoy pelao.","I can't go out, I'm broke."],["B1","pr","Tripear","To tease / mess with","slang","Deja de tripearme.","Stop messing with me."],["B1","pr","Charro","Corny / cheesy","slang","Ese chiste est\xE1 bien charro.","That joke is really corny."],["B1","pr","Corillo","Group of friends / crew","slang","Voy a salir con el corillo.","I'm going out with the crew."],["B1","pr","Revol\xFA","Mess / chaos","slang","\xA1Qu\xE9 revol\xFA hay en la cocina!","What a mess in the kitchen!"],["B1","pr","Embuste","A lie","slang","Eso es un embuste.","That's a lie."],["B1","pr","\xA1Fo!","Ugh! / Gross!","slang","\xA1Fo! \xBFQu\xE9 huele as\xED?","Ugh! What smells like that?"],["B1","pr","J\xEDbaro","Country person from PR's mountains (often affectionate)","vocab","Mi abuelo era j\xEDbaro de Utuado.","My grandpa was a country man from Utuado."],["B2","latam","Si hubiera sabido","If I had known","phrase","Si hubiera sabido, te habr\xEDa avisado.","If I had known, I would've told you.","Grammar: si + pluperfect subjunctive, then habr\xEDa + participle."],["B2","latam","Como si","As if","phrase","Habla como si fuera el jefe.","He talks as if he were the boss.","Grammar: como si + imperfect subjunctive."],["B2","latam","Aunque llueva","Even if it rains","phrase","Aunque llueva, vamos a ir.","Even if it rains, we're going.",'Aunque + indicative = "although" (a fact). Aunque + subjunctive = "even if".'],["B2","latam","Por mucho que","No matter how much","phrase","Por mucho que trabaje, no me alcanza.","No matter how much I work, it's not enough."],["B2","latam","Siempre y cuando","As long as / provided that","phrase","Te ayudo, siempre y cuando me avises temprano.","I'll help, as long as you let me know early."],["B2","latam","A menos que","Unless","phrase","No voy, a menos que me invites.","I'm not going unless you invite me."],["B2","latam","Dado que","Given that","phrase","Dado que no hay presupuesto, lo vamos a posponer.","Given that there's no budget, we'll postpone it."],["B2","latam","De hecho","In fact","phrase","De hecho, ya lo hab\xEDa terminado.","In fact, I had already finished it."],["B2","latam","En cambio","On the other hand","phrase","\xC9l es tranquilo; su hermano, en cambio, no para.","He's calm; his brother, on the other hand, never stops."],["B2","latam","Lo que pasa es que","The thing is that","phrase","Lo que pasa es que no me pagaron a tiempo.","The thing is they didn't pay me on time."],["B2","latam","Resulta que","It turns out that","phrase","Resulta que el jefe ya lo sab\xEDa.","It turns out the boss already knew."],["B2","latam","Se me olvid\xF3","I forgot (it slipped my mind)","phrase","Se me olvid\xF3 la lonchera.","I forgot my lunchbox.",'Grammar: "se me" = it happened to me by accident (se me cay\xF3, se me rompi\xF3).'],["B2","latam","Se me hace tarde","I'm running late","phrase","Me voy, que se me hace tarde.","I'm leaving, I'm running late."],["B2","latam","Comprometerse","To commit (to something)","verb","Se comprometi\xF3 a terminarlo el viernes.","He committed to finishing it Friday."],["B2","latam","Plantear","To bring up / propose","verb","Le plante\xE9 la idea al supervisor.","I brought the idea up with the supervisor."],["B2","latam","Desempe\xF1ar","To play (a role) / carry out (a job)","verb","Desempe\xF1a un papel clave en el equipo.","He plays a key role on the team."],["B2","latam","Superar","To overcome / get over","verb","Super\xF3 el miedo a hablar en p\xFAblico.","She got over her fear of public speaking."],["B2","latam","Rendirse","To give up","verb","No te rindas ahora.","Don't give up now."],["B2","latam","Hacer hincapi\xE9 en","To emphasize","phrase","El instructor hizo hincapi\xE9 en la seguridad.","The instructor emphasized safety."],["B2","latam","Llevar a cabo","To carry out","phrase","Llevaron a cabo la inspecci\xF3n ayer.","They carried out the inspection yesterday."],["B2","latam","A la larga","In the long run","phrase","A la larga, estudiar te va a abrir puertas.","In the long run, studying will open doors for you."],["B2","latam","Ni siquiera","Not even","phrase","Ni siquiera me salud\xF3.","He didn't even say hi to me."],["B2","latam","Ya que","Since (because)","phrase","Ya que est\xE1s aqu\xED, ay\xFAdame con esto.","Since you're here, help me with this."],["B2","latam","Por lo visto","Apparently","phrase","Por lo visto, ma\xF1ana no hay trabajo.","Apparently there's no work tomorrow."],["B2","latam","Dar por hecho","To take for granted / assume","phrase","No des por hecho que te van a subir el sueldo.","Don't assume they'll give you a raise."],["B2","latam","Salirse con la suya","To get one's way","phrase","Siempre se sale con la suya.","He always gets his way."],["B2","latam","Aprovecharse de","To take advantage of (someone)","verb","Se aprovecharon de su confianza.","They took advantage of his trust."],["B2","latam","Meter la pata","To mess up / put your foot in it","phrase","Met\xED la pata con lo que dije.","I messed up with what I said."],["B2","latam","Estar en las nubes","To be daydreaming","phrase","Perdona, estaba en las nubes.","Sorry, I was daydreaming."],["B2","latam","No tener pelos en la lengua","To not mince words","phrase","Mi t\xEDa no tiene pelos en la lengua.","My aunt doesn't mince words."],["B2","latam","Costar un ojo de la cara","To cost an arm and a leg","phrase","Ese carro cuesta un ojo de la cara.","That car costs an arm and a leg."],["B2","latam","Ponerse las pilas","To get your act together","phrase","Me tengo que poner las pilas con el espa\xF1ol.","I have to get my act together with Spanish."],["B2","latam","Estar hasta la coronilla","To be completely fed up","phrase","Estoy hasta la coronilla de excusas.","I'm completely fed up with excuses."],["B2","latam","Echar una mano","To lend a hand","phrase","\xBFMe echas una mano con la mudanza?","Can you give me a hand with the move?"],["B2","latam","Cabe destacar que","It's worth noting that","phrase","Cabe destacar que nadie result\xF3 herido.","It's worth noting that nobody was hurt."],["B2","pr","\xA1Qu\xE9 n\xEDtido!","How cool! / So nice!","slang","\xA1Qu\xE9 n\xEDtido te qued\xF3 el patio!","Your patio came out so nice!"],["B2","pr","Estar ajorao","To be in a rush","slang","No puedo hablar, estoy ajorao.","I can't talk, I'm in a rush.",'From "ajorar" (to rush someone).'],["B2","pr","Bochinchero/a","A gossip","slang","Esa vecina es bien bochinchera.","That neighbor is a big gossip.","Bochinche = gossip."],["B2","pr","Darle cr\xE1neo","To think hard about something","slang","Le di cr\xE1neo toda la noche.","I thought about it all night."],["B2","pr","Aguzao","Sharp / street-smart","slang","Ese nene es bien aguzao.","That kid is really sharp."],["B2","pr","Chacho","Man! / Wow! (from muchacho)","slang","Chacho, qu\xE9 susto me diste.","Man, you scared me."],["B2","pr","Estar a mill\xF3n","To be slammed / super busy","slang","Hoy estoy a mill\xF3n en el trabajo.","I'm slammed at work today."],["C1","latam","De haberlo sabido","Had I known","phrase","De haberlo sabido, no habr\xEDa venido.","Had I known, I wouldn't have come.",'Grammar: de + haber + participle replaces "si hubiera...".'],["C1","latam","Quienquiera que","Whoever","phrase","Quienquiera que haya sido, que d\xE9 la cara.","Whoever it was should own up."],["C1","latam","Sea como sea","Be that as it may / whatever happens","phrase","Sea como sea, hay que terminarlo hoy.","Be that as it may, it has to be done today."],["C1","latam","Por m\xE1s que","No matter how hard / however much","phrase","Por m\xE1s que lo intento, no me sale.","No matter how hard I try, I can't get it."],["C1","latam","Con tal de que","As long as / provided that","phrase","Hago lo que sea con tal de que mis hijos est\xE9n bien.","I'll do whatever it takes as long as my kids are okay."],["C1","latam","No es que... sino que","It's not that... it's that","phrase","No es que no quiera, sino que no puedo.","It's not that I don't want to, it's that I can't.",'Grammar: "no es que" takes the subjunctive.'],["C1","latam","Lo de","The thing about / the matter of","phrase","\xBFQu\xE9 pas\xF3 con lo de tu contrato?","What happened with the contract thing?"],["C1","latam","En lo que respecta a","As far as... is concerned","phrase","En lo que respecta a la seguridad, no hay excepciones.","As far as safety goes, there are no exceptions."],["C1","latam","Habida cuenta de","Taking into account (formal)","phrase","Habida cuenta de los retrasos, se ajust\xF3 el calendario.","Given the delays, the schedule was adjusted."],["C1","latam","No obstante","Nevertheless (formal)","vocab","Los costos subieron; no obstante, cumplimos la meta.","Costs went up; nevertheless, we met the goal."],["C1","latam","Por ende","Therefore (formal)","vocab","La tuber\xEDa fall\xF3 y, por ende, se detuvo el proyecto.","The pipe failed and, therefore, the project stopped."],["C1","latam","Cabe la posibilidad de que","There's a chance that","phrase","Cabe la posibilidad de que nos trasladen a otra ciudad.","There's a chance they'll transfer us to another city."],["C1","latam","A ra\xEDz de","As a result of / following","phrase","A ra\xEDz del accidente, cambiaron los protocolos.","Following the accident, they changed the protocols."],["C1","latam","Sacarle provecho a","To make the most of / benefit from","phrase","Hay que sacarle provecho a cada oportunidad.","You have to make the most of every opportunity."],["C1","latam","Atenerse a","To abide by / face (consequences)","verb","Si no cumples, atente a las consecuencias.","If you don't comply, face the consequences."],["C1","latam","Recalcar","To stress / underline","verb","Quiero recalcar que esto es temporal.","I want to stress that this is temporary."],["C1","latam","Matizar","To qualify / add nuance to","verb","D\xE9jame matizar lo que dije.","Let me qualify what I said."],["C1","latam","Vislumbrar","To glimpse / begin to see","verb","Ya se vislumbra una soluci\xF3n.","A solution is starting to emerge."],["C1","latam","Desenvolverse","To handle oneself / get by well","verb","Se desenvuelve muy bien en ingl\xE9s y espa\xF1ol.","He handles himself very well in English and Spanish."],["C1","latam","Paulatinamente","Gradually","vocab","Paulatinamente fue mejorando su acento.","Gradually his accent got better."],["C1","latam","Id\xF3neo","Ideal / well-suited","vocab","Es el candidato id\xF3neo para el puesto.","He's the ideal candidate for the position."],["C1","latam","\xC1mbito","Field / sphere / setting","vocab","En el \xE1mbito laboral, hay que ser puntual.","In a work setting, you have to be punctual."],["C1","latam","Ineludible","Unavoidable","vocab","Es un compromiso ineludible.","It's a commitment I can't get out of."],["C1","latam","Quisiera","I would like (very polite)","verb","Quisiera hablar con el encargado.","I'd like to speak with the person in charge.","Imperfect subjunctive used for extra politeness."],["C1","latam","Ser\xE1n las tres","It must be about three","phrase","\u2014\xBFQu\xE9 hora es? \u2014Ser\xE1n las tres.","\u2014What time is it? \u2014It must be about three.","Grammar: the future tense can express a guess about the present."],["C1","latam","Hacer la vista gorda","To turn a blind eye","phrase","El supervisor hizo la vista gorda.","The supervisor turned a blind eye."],["C1","latam","Ir al grano","To get to the point","phrase","Vamos al grano: \xBFcu\xE1nto cuesta?","Let's get to the point: how much is it?"],["C1","latam","Andarse por las ramas","To beat around the bush","phrase","Deja de andarte por las ramas.","Stop beating around the bush."],["C1","latam","Tomarle el pelo a alguien","To pull someone's leg","phrase","\xBFMe est\xE1s tomando el pelo?","Are you pulling my leg?"],["C1","latam","Dar en el clavo","To hit the nail on the head","phrase","Diste en el clavo con esa idea.","You hit the nail on the head with that idea."],["C1","latam","Estar entre la espada y la pared","To be between a rock and a hard place","phrase","Estoy entre la espada y la pared con este trabajo.","I'm between a rock and a hard place with this job."],["C1","latam","A rega\xF1adientes","Reluctantly","phrase","Acept\xF3 a rega\xF1adientes.","He accepted reluctantly."],["C1","latam","De buenas a primeras","Out of nowhere / all of a sudden","phrase","De buenas a primeras, renunci\xF3.","Out of nowhere, he quit."],["C1","latam","Hacer de tripas coraz\xF3n","To pluck up the courage","phrase","Hice de tripas coraz\xF3n y ped\xED el aumento.","I plucked up the courage and asked for the raise."],["C1","latam","Camar\xF3n que se duerme se lo lleva la corriente","You snooze, you lose","phrase","Ap\xFArate con la solicitud: camar\xF3n que se duerme se lo lleva la corriente.","Hurry with the application: you snooze, you lose.","Saying used across Latin America, PR included."],["C1","latam","Harina de otro costal","A whole different story","phrase","Eso ya es harina de otro costal.","That's a whole different story."],["C1","latam","Al pie de la letra","To the letter","phrase","Sigue las instrucciones al pie de la letra.","Follow the instructions to the letter."],["C1","latam","Dicho sea de paso","Incidentally / by the way","phrase","Dicho sea de paso, el reporte estaba incompleto.","Incidentally, the report was incomplete."],["C1","pr","Coger lucha","To stress out / get worked up","slang","No cojas lucha con eso.","Don't stress about that."],["C1","pr","Ponerse fresco","To get cheeky / disrespectful","slang","No te pongas fresco con tu mai.","Don't get smart with your mom."],["C1","pr","Como el arroz blanco","In on everything (l
